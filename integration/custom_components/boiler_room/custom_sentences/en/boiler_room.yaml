language: "en"

lists:
  game_name:
    wildcard: true
  app_name:
    wildcard: true
  query:
    wildcard: true
  volume:
    wildcard: true

intents:
  BoilerRoomLaunchGame:
    data:
      - sentences:
          - "(Launch|Play|Start|Open|Run|Boot up|Fire up) {game_name}"
          - "Put on {game_name}"
          - "(Launch|Play|Start|Open|Run) {game_name} on the (deck|steam machine|tv|living room|gaming pc)"

  BoilerRoomOpenApp:
    data:
      - sentences:
          - "Open {app_name} on the (deck|steam machine|tv|living room|gaming pc)"
          - "(Launch|Start) the {app_name} app"

  BoilerRoomJellyfinSearch:
    data:
      # With type hint: "Play the movie Fargo on Jellyfin"
      - sentences:
          - "(Play|Watch|Put on) the movie {query} on Jellyfin"
        slots:
          media_type: "Movie"
      - sentences:
          - "(Play|Watch|Put on) the (show|series|tv show) {query} on Jellyfin"
        slots:
          media_type: "Series"
      - sentences:
          - "(Play|Listen to|Put on) the album {query} on Jellyfin"
        slots:
          media_type: "MusicAlbum"
      - sentences:
          - "(Play|Listen to|Put on) the song {query} on Jellyfin"
        slots:
          media_type: "Audio"
      # Without type hint: "Play Fargo on Jellyfin"
      - sentences:
          - "(Play|Watch|Listen to|Put on|Search|Find) {query} on Jellyfin"

  BoilerRoomJellyfinBrowse:
    data:
      - sentences:
          - "(Show|Browse|Find|Look up|Go to) the movie {query} on Jellyfin"
        slots:
          media_type: "Movie"
      - sentences:
          - "(Show|Browse|Find|Look up|Go to) the (show|series|tv show) {query} on Jellyfin"
        slots:
          media_type: "Series"
      - sentences:
          - "(Show|Browse|Find|Look up|Go to) the (album|artist|band) {query} on Jellyfin"
        slots:
          media_type: "MusicAlbum,MusicArtist"
      - sentences:
          - "(Show me|Browse|Look up) {query} on Jellyfin"

  BoilerRoomYouTubeSearch:
    data:
      - sentences:
          - "Search YouTube for {query}"
          - "(Open|Play|Watch) {query} on YouTube"

  BoilerRoomSystemControl:
    data:
      - sentences:
          - "(Suspend|Sleep) the (deck|steam machine|gaming pc)"
          - "Put the (deck|steam machine|gaming pc) to sleep"
        slots:
          action: "suspend"
      - sentences:
          - "(Turn off|Shut down|Shutdown|Power off) the (deck|steam machine|gaming pc)"
        slots:
          action: "shutdown"
      - sentences:
          - "(Reboot|Restart) the (deck|steam machine|gaming pc)"
        slots:
          action: "reboot"
      - sentences:
          - "(Set|Change) (deck|steam machine) volume to {volume}"
