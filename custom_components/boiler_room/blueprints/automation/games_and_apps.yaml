blueprint:
  name: "Boiler Room: Games & Apps"
  description: >
    Voice commands for launching Steam games and apps on your SteamOS device.
    Say "Launch Baldur's Gate 3", "Play Soulstone Survivors", "Open YouTube on the deck", etc.
    Supports fuzzy matching and app aliases configured in the integration settings.
  domain: automation

mode: single

triggers:
  - trigger: conversation
    command:
      - "(Launch|Play|Start|Open|Run|Boot up|Fire up) {game_name}"
      - "Put on {game_name}"
      - "(Launch|Play|Start|Open|Run) {game_name} on the (deck|steam machine|tv|living room|gaming pc)"
    id: launch_game
  - trigger: conversation
    command:
      - "Open {app_name} on the (deck|steam machine|tv|living room|gaming pc)"
      - "(Launch|Start) the {app_name} app"
    id: launch_app

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: launch_game
        sequence:
          - action: boiler_room.launch_game
            data:
              name: "{{ trigger.slots.game_name }}"
            response_variable: result
          - set_conversation_response: "{{ result.speech }}"
      - conditions:
          - condition: trigger
            id: launch_app
        sequence:
          - action: boiler_room.launch_app
            data:
              name: "{{ trigger.slots.app_name }}"
            response_variable: result
          - set_conversation_response: "{{ result.speech }}"
