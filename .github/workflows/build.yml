name: Build Agent

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod

      - name: gofmt
        working-directory: ./agent
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:" "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: ./agent
        run: go vet ./...

      - name: go test
        working-directory: ./agent
        run: go test ./...

      # Must satisfy the Requires-Python of the current pytest-homeassistant-custom-component
      # (3.14 since HA 2026.3). On an older Python, pip does not fail: it quietly resolves the
      # last harness release that supports it, and the tests run against a stale HA.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Integration unit tests
        run: |
          python -m pip install --quiet aiohttp hassil
          python -m unittest discover -s tests -t . -v

      - name: Integration tests in the Home Assistant harness
        run: |
          python -m pip install --quiet pytest-homeassistant-custom-component
          python -m pip install --quiet $(python tests/ha/requirements.py)
          python -m pytest tests/ha -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod

      - name: Build
        working-directory: ./agent
        run: |
          # A tag v0.5.3 stamps "0.5.3" (what the updater compares against release
          # tags); any other build stamps "dev-<commit>", which keeps the updater off.
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="dev-${GITHUB_SHA::7}"; fi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o ../boiler-room-agent-linux-amd64 \
            ./cmd/boiler-room-agent/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: boiler-room-agent-linux-amd64
          path: boiler-room-agent-linux-amd64

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: boiler-room-agent-linux-amd64

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: boiler-room-agent-linux-amd64
          generate_release_notes: true
