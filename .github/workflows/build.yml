name: Build Agent

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod

      - name: gofmt
        working-directory: ./agent
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:" "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: ./agent
        run: go vet ./...

      - name: go test
        working-directory: ./agent
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Integration unit tests
        run: |
          python -m pip install --quiet aiohttp
          python -m unittest discover -s tests -t . -v

      - name: Integration tests in the Home Assistant harness
        run: |
          python -m pip install --quiet pytest-homeassistant-custom-component
          python -m pytest tests/ha -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod

      - name: Build
        working-directory: ./agent
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o ../boiler-room-agent-linux-amd64 \
            ./cmd/boiler-room-agent/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: boiler-room-agent-linux-amd64
          path: boiler-room-agent-linux-amd64

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: boiler-room-agent-linux-amd64

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: boiler-room-agent-linux-amd64
          generate_release_notes: true
